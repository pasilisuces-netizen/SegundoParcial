{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block email_title %}NeuralTech{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#1F2833; font-family: Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#1F2833; padding:32px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background-color:#0B0C10; border:1px solid rgba(0,173,181,0.25); border-radius:6px; overflow:hidden;">

                <!-- ── LOGO DE LA EMPRESA ── -->
                <tr>
                    <td align="center" style="background-color:#0B0C10; padding:32px 24px 20px; border-bottom:1px solid rgba(0,173,181,0.2);">
                        <div style="font-family: 'Courier New', Courier, monospace; font-size:26px; font-weight:bold; letter-spacing:1px;">
                            <span style="color:#00ADB5;">[</span><span style="color:#EAEAEA;">NEURAL</span><span style="color:#00ADB5;">TECH</span><span style="color:#00ADB5;">]</span>
                        </div>
                        <div style="color:#6B7280; font-size:11px; letter-spacing:2px; text-transform:uppercase; margin-top:6px;">
                            Soluciones de Inteligencia Artificial
                        </div>
                    </td>
                </tr>

                <!-- ── CONTENIDO ── -->
                <tr>
                    <td style="padding:32px 28px; color:#C5C6C7; font-size:15px; line-height:1.6;">
                        {% block email_content %}{% endblock %}
                    </td>
                </tr>

                <!-- ── FOOTER ── -->
                <tr>
                    <td style="padding:20px 28px; border-top:1px solid rgba(0,173,181,0.15); color:#6B7280; font-size:12px; text-align:center;">
                        Este es un mensaje automático de <strong style="color:#00ADB5;">NeuralTech</strong>. Por favor no respondas a este correo.
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
