{% load static %}
<header>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="{% url 'inicio' %}" class="nav-logo">
                <span class="logo-bracket">[</span>
                NEURAL<span class="logo-accent">TECH</span>
                <span class="logo-bracket">]</span>
            </a>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="{% url 'inicio' %}"     class="nav-link {% block nav_inicio %}{% endblock %}">Inicio</a></li>
                <li><a href="{% url 'servicios' %}"  class="nav-link {% block nav_servicios %}{% endblock %}">Productos</a></li>
                <li><a href="{% url 'tecnologia' %}" class="nav-link {% block nav_tecnologia %}{% endblock %}">Tecnología</a></li>
                <li><a href="{% url 'contacto' %}"   class="nav-link {% block nav_contacto %}{% endblock %}">Contacto</a></li>
                {% if user.is_authenticated %}
                <li>
                    <a href="{% url 'dashboard' %}" class="nav-link {% block nav_dashboard %}{% endblock %}">
                        Dashboard
                    </a>
                </li>
                <li class="nav-user">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span>{{ user.get_full_name|default:user.username }}</span>
                </li>
                {% else %}
                <li><a href="{% url 'registro' %}"   class="nav-link {% block nav_registro %}{% endblock %}">Identificate</a></li>
                {% endif %}
            </ul>
        </div>
    </nav>
</header>
